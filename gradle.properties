# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.0
group=dev.chickenthedev
java_version=25

# Common
minecraft_version=26.3
mod_name=Helldivers Stratagems
mod_author=ChickentheDev
mod_id=stratagems
license=MIT
credits=
description=Call down Helldivers-style stratagems: enter arrow-key codes, throw the beacon, and watch the skies fall. \nFabric + NeoForge.
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.6+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.1-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx1536m
org.gradle.daemon=true
# Optional: pin a local JDK for the Gradle daemon itself, e.g.:
# org.gradle.java.home=/path/to/your/jdk-25
# Compilation uses a Java 25 toolchain resolved automatically (foojay resolver),
# so this project builds on any machine with a JDK installed.
